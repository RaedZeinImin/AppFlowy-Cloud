services:
  gotrue:
    image: appflowy-gotrue:local
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
  appflowy_cloud:
    image: appflowy-cloud:local
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
  appflowy_worker:
    image: appflowy-worker:local
  admin_frontend:
    image: appflowy-admin:local
    environment:
      - ADMIN_FRONTEND_REDIS_URL=redis://redis:6379
      - ADMIN_FRONTEND_GOTRUE_URL=http://gotrue:9999
      - ADMIN_FRONTEND_APPFLOWY_CLOUD_URL=http://appflowy_cloud:8000
      - ADMIN_FRONTEND_PATH_PREFIX=/console
  appflowy_web:
    image: appflowy-web:local
  # AI service - disabled (no AI features)
  ai:
    profiles:
      - disabled
