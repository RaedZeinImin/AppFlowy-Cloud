# Nginx configuration for AppFlowy-Cloud local testing
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        client_max_body_size 10M;

        set $appflowy_cloud_backend "http://appflowy_cloud:8000";
        set $gotrue_backend "http://gotrue:9999";
        set $appflowy_web_backend "http://appflowy_web:80";
        set $admin_frontend_backend "http://admin_frontend:3000";
        set $minio_backend "http://minio:9001";

        # GoTrue authentication
        location /gotrue/ {
            proxy_pass $gotrue_backend;
            rewrite ^/gotrue(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;
        }

        # WebSocket
        location /ws {
            proxy_pass $appflowy_cloud_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # API
        location /api {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header Host $http_host;
        }

        # Admin Frontend - redirect /console to /console/web/login
        location = /console {
            return 301 /console/web/login;
        }
        
        location = /console/ {
            return 301 /console/web/login;
        }
        
        # Admin Frontend - handle all /console paths
        location /console {
            proxy_pass $admin_frontend_backend;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # MinIO console
        location /minio/ {
            proxy_pass $minio_backend;
            rewrite ^/minio/(.*) /$1 break;
            proxy_set_header Host $http_host;
        }

        # Web UI
        location / {
            proxy_pass $appflowy_web_backend;
            proxy_set_header Host $host;
        }
    }
}
